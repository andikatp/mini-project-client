  <!-- Box Lid -->
  <rect x="132" y="125" width="136" height="22" rx="7" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" />
  <rect x="188" y="125" width="24" height="22" fill="#F59E0B" />
  <!-- Ribbon Bow -->
  <path d="M188 125C170 110 160 85 185 85C200 85 200 115 200 125Z" fill="#FBBF24" stroke="#D97706" stroke-width="2" />
  <path d="M212 125C230 110 240 85 215 85C200 85 200 115 200 125Z" fill="#FBBF24" stroke="#D97706" stroke-width="2" />

  <!-- Golden VIP Ticket popping out of box -->
  <g transform="translate(130, 45) rotate(-8)">
