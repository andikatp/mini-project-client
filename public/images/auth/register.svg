  <circle cx="320" cy="70" r="4" fill="#3B82F6" />
  <circle cx="340" cy="120" r="3" fill="#EC4899" />
  <polygon points="100,100 105,108 95,108" fill="#10B981" />
  <polygon points="290,95 295,103 285,103" fill="#F59E0B" />

  <!-- Giant Welcome Gift Box -->
