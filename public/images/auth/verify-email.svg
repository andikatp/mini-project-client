<svg viewBox="40 40 265 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Flying Mail Envelope with stamp -->
  <rect x="110" y="100" width="180" height="120" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
  <path d="M110 100L200 170L290 100" stroke="#0284C7" stroke-width="3" fill="#E0F2FE" />
  <!-- Letter inside -->
  <rect x="125" y="70" width="150" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
  <rect x="145" y="85" width="70" height="8" rx="4" fill="#0284C7" />
  <rect x="145" y="100" width="110" height="6" rx="3" fill="#CBD5E1" />
  <rect x="145" y="112" width="90" height="6" rx="3" fill="#CBD5E1" />

  <!-- Verification Shield Badge on top right -->
  <g transform="translate(250, 75)">
    <path d="M25 0L45 10V25C45 38 25 50 25 50C25 50 5 38 5 25V10L25 0Z" fill="#10B981" stroke="#047857" stroke-width="2.5" />
    <path d="M18 24L23 29L32 18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating paper plane -->
  <g transform="translate(80, 50) rotate(-15)">
    <polygon points="0,20 40,0 20,40 16,22" fill="#38BDF8" stroke="#0284C7" stroke-width="2" />
  </g>
  <path d="M50 75Q70 65 85 70" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
</svg>
